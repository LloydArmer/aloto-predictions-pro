# codemagic.yaml
#
# Cloud builds for the native apps. Nothing here needs Android Studio or a Mac
# on your machine — Codemagic provides both, which is what makes iOS possible
# from Windows at all.
#
# The iOS project IS committed to the repo, and must stay that way.
#
# It began as generated-every-build, which is tidy while everything native is
# generated. It stops working the moment there is hand-written Swift in the
# project — a widget extension, a Capacitor plugin — because regenerating would
# silently delete it. `cap sync` updates an existing project instead, keeping
# custom targets and build settings intact.
#
# Android is still generated each build; there is nothing hand-written in it.
#
# The shared steps are written out in full in each workflow rather than shared
# through a YAML anchor. An anchor holding a list, referenced inside another
# list, nests one inside the other — valid YAML, rejected by Codemagic with
# "str type expected".
#
# Before the first run, set these in the Codemagic UI (Environment variables),
# marking each group "secure":
#
#   group: appstore         from App Store Connect -> Users and Access ->
#                           Integrations -> App Store Connect API
#     APP_STORE_CONNECT_ISSUER_ID
#     APP_STORE_CONNECT_KEY_IDENTIFIER
#     APP_STORE_CONNECT_PRIVATE_KEY    the whole .p8 file contents
#
#   group: firebase
#     GOOGLE_SERVICE_INFO_PLIST  contents of GoogleService-Info.plist (iOS)
#     GOOGLE_SERVICES_JSON       contents of google-services.json — Android only,
#                                not needed until you come back to that platform
#
#   group: supabase          the same values as Netlify
#     VITE_SUPABASE_URL
#     VITE_SUPABASE_ANON_KEY
#     VITE_FIREBASE_API_KEY
#     VITE_FIREBASE_AUTH_DOMAIN
#     VITE_FIREBASE_PROJECT_ID
#     VITE_FIREBASE_STORAGE_BUCKET
#     VITE_FIREBASE_SENDER_ID
#     VITE_FIREBASE_APP_ID
#     VITE_FIREBASE_VAPID_KEY
#     VITE_REVENUECAT_APPLE_KEY  RevenueCat's public Apple API key (starts appl_).
#                                iOS only; without it the app cannot sell Pro.

workflows:

  # ═════════════════════════════════════════════════════════════════════════
  # iOS is first. It's the platform being launched on, and it has no
  # device-verification hurdle — Apple lets you build and distribute through
  # TestFlight as soon as the Developer account is approved.
  # ═════════════════════════════════════════════════════════════════════════
  ios:
    name: iOS
    # Apple's toolchain only runs on macOS, so this has to be a mac instance
    # whether you own a Mac or not. That's the point of building in the cloud.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Capacitor 8's CLI requires Node >=22 and exits immediately on anything
      # older. No cocoapods entry either — Capacitor 8 uses Swift Package
      # Manager, so there's no Podfile to install.
      node: 22
      xcode: latest
      groups:
        - firebase
        - supabase
        - appstore
      vars:
        # Read by the signing step below. Kept here rather than in an
        # ios_signing block so nothing needs configuring in the Codemagic UI —
        # that screen moves around and differs by account type, whereas
        # environment variables are the same everywhere.
        BUNDLE_ID: "com.alotoprediction.app"
        # Apple's numeric id for the app, from the App Store Connect URL:
        # appstoreconnect.apple.com/apps/6805768246/... — used to look up the
        # last build number so this one can be higher.
        APP_ID: "6805768246"
        # The version users see. DIFFERENT from the build number above, and the
        # one people forget: Apple CLOSES a version once it is approved, so a
        # build still claiming 1.0 is rejected with "the train version '1.0' is
        # closed for new build submissions" — after a full build has run.
        #
        # Bump this for every release: 1.1, 1.2, 2.0. The build number takes
        # care of itself; this does not.
        MARKETING_VERSION: "1.2"

    scripts:
      - name: Check the required settings are present
        # Fails in seconds rather than after a full build. A missing RevenueCat
        # key doesn't break the build: it produces an app that installs, runs,
        # and says "Purchases are not configured" where the price should be.
        # That is only discovered on a phone, or by Apple's reviewer.
        script: |
          MISSING=""
          for NAME in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_REVENUECAT_APPLE_KEY; do
            if [ -z "${!NAME}" ]; then MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing from the Codemagic environment:$MISSING"
            echo "Add them to the 'supabase' group, then run the build again."
            exit 1
          fi
          echo "All required settings present."

      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Check the iOS project is committed
        # Deliberately fails rather than generating one. A missing ios/ folder
        # used to mean "generate it"; now it means something is wrong, because
        # the project holds hand-written Swift that cannot be regenerated.
        #
        # Silently creating a fresh project here would produce a build that
        # works and is missing the widget extension — the worst kind of
        # failure, since nothing looks broken until a feature is quietly absent.
        script: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ios/ is missing from the repository."
            echo ""
            echo "It is committed on purpose: it contains hand-written Swift"
            echo "(the Live Activity widget and Capacitor plugins) which cannot"
            echo "be regenerated. Restore it from git rather than running"
            echo "'npx cap add ios', which would create an empty project and"
            echo "produce a build quietly missing those features."
            exit 1
          fi
          echo "iOS project present."

      - name: Sync the web build into the native project
        # sync, never add. Updates web assets and plugin registrations in the
        # existing project, leaving custom targets and build settings alone.
        script: npx cap sync ios

      - name: Drop in GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist

      - name: Prepare the keychain
        # Must run before fetching, or there's nowhere to put the certificate.
        script: keychain initialize

      - name: Fetch signing files from Apple
        # Reads four variables from the environment, so nothing needs setting up
        # in the Codemagic UI:
        #
        #   APP_STORE_CONNECT_ISSUER_ID       who is asking
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY
        #   CERTIFICATE_PRIVATE_KEY           signs the certificate being made
        #
        # That last one is the reason this step failed before. --create has to
        # CREATE a distribution certificate, and a certificate can't exist
        # without a private key behind it.
        #
        # It's supplied as a stored variable rather than generated here on
        # purpose: a new key each build means a new certificate each build, and
        # Apple allows only three distribution certificates per account. Three
        # builds and you'd be locked out.
        script: |
          # The app itself.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # And the widget extension, which is a SEPARATE app on Apple's side
          # with its own bundle id and its own provisioning profile. Without
          # this the archive fails with "ALOTOWidgetExtension requires a
          # provisioning profile" — the app signs fine and the extension has
          # nothing to sign with.
          #
          # Xcode names an extension's bundle id after its parent, so this is
          # the app's id with the target name appended.
          app-store-connect fetch-signing-files "$BUNDLE_ID.ALOTOWidget" \
            --type IOS_APP_STORE \
            --create

      - name: Add the certificate to the keychain
        script: keychain add-certificates

      - name: Apply the profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Set the build and marketing versions
        # TWO different numbers, and both have to be right.
        #
        # The BUILD number must be higher than the last upload, or Apple rejects
        # it as a duplicate.
        #
        # The MARKETING version (1.0, 1.1) is what users see, and Apple closes a
        # version to new builds once it has been approved. That is what failed
        # the last build: the number was fine, the version string still said 1.0.
        #
        # This has now failed repeatedly, because the App Store Connect lookup
        # returns nothing and the old fallback — Codemagic's own build counter —
        # bears no relation to what Apple actually holds. It produced numbers
        # already used, over and over.
        #
        # So the fallback is now derived from the CLOCK: minutes elapsed since
        # the start of 2026. That number only ever increases, can never repeat,
        # and is already far above anything uploaded by hand, so it cannot
        # collide with Apple's history whatever that history happens to be.
        #
        # The App Store Connect lookup is still preferred when it works, because
        # +1 keeps the numbers tidy and readable. The clock is the safety net.
        script: |
          set -e

          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || true)
          echo "App Store Connect reports latest build: '${LATEST:-<lookup failed>}'"

          # Minutes since 2026-01-01. Monotonic by construction: roughly 370,000
          # today and rising by one a minute, so every build is higher than the
          # last no matter how often you build.
          CLOCK=$(( ($(date +%s) - 1767225600) / 60 ))

          if echo "$LATEST" | grep -qE '^[0-9]+$'; then
            NEXT=$((LATEST + 1))
            echo "Using App Store Connect + 1"
          else
            NEXT="$CLOCK"
            echo "Lookup failed — using a clock-derived number instead ($NEXT)."
            echo "This cannot collide with anything already uploaded."
          fi

          # An explicit override, for pinning a number by hand.
          if [ -n "$BUILD_NUMBER_OVERRIDE" ]; then
            NEXT="$BUILD_NUMBER_OVERRIDE"
            echo "Overridden to $NEXT"
          fi

          # Last line of defence. If the number somehow came out lower than the
          # clock, the clock wins — a too-low number is the one failure mode
          # that has actually bitten, and it costs a whole build to discover.
          if [ "$NEXT" -lt 100 ]; then
            echo "Computed $NEXT looks too low to be safe — using $CLOCK instead."
            NEXT="$CLOCK"
          fi

          echo "Building version $NEXT (marketing version $MARKETING_VERSION)"
          cd ios/App
          agvtool new-version -all "$NEXT"
          agvtool new-marketing-version "$MARKETING_VERSION"

          # Confirm both actually took. agvtool can report success while leaving
          # the project untouched if the build settings aren't where it expects.
          APPLIED=$(agvtool what-version -terse)
          echo "Project now reports build number: $APPLIED"
          if [ "$APPLIED" != "$NEXT" ]; then
            echo "agvtool did not apply the build number — aborting rather than uploading a duplicate."
            exit 1
          fi

          # Read straight from the Info.plist rather than asking agvtool.
          #
          # `agvtool what-marketing-version` returns nothing on this toolchain
          # even when the version HAS been set — the first attempt at this check
          # failed a build whose version had been applied correctly, which is
          # worse than not checking at all.
          #
          # PlistBuddy reads the file agvtool just wrote, so it reports what is
          # actually in the bundle.
          APPLIED_MV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist 2>/dev/null || echo "")
          echo "Info.plist now reports marketing version: ${APPLIED_MV:-<unreadable>}"

          if [ -z "$APPLIED_MV" ]; then
            # Could not read it. Warn rather than abort: agvtool reported success
            # above, and failing here would repeat exactly the mistake this
            # comment describes.
            echo "Could not read the marketing version back — continuing anyway."
            echo "If the upload fails with error 90062, this is where to look."
          elif [ "$APPLIED_MV" != "$MARKETING_VERSION" ]; then
            echo "Marketing version is '$APPLIED_MV', expected '$MARKETING_VERSION' — aborting."
            echo "Uploading would fail at the very end with error 90062 after a full build."
            exit 1
          fi

      - name: Build the archive
        # --project, not --workspace. Capacitor 8 uses Swift Package Manager
        # rather than CocoaPods, so there's no Podfile and no .xcworkspace —
        # only App.xcodeproj and a Package.swift. Xcode resolves the packages
        # itself during the build.
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

      - name: Upload to TestFlight
        # Done as a build step rather than through the publishing block.
        # publishing -> app_store_connect -> auth: integration insists on a
        # named integration configured in the Codemagic UI; this CLI reads the
        # same APP_STORE_CONNECT_* environment variables the signing steps
        # already use, so nothing needs setting up there.
        #
        # Uploads only. --testflight is deliberately absent: it submits the
        # build for EXTERNAL beta review, which needs Test Information (feedback
        # email, contact details) filled in first, and fails the build until it
        # is. The upload on its own makes the build available to internal
        # testers immediately, which is all that's needed to install it.
        #
        # Add --testflight later, once Test Information is complete and you want
        # your league testing it.
        script: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - admin@alotopredictionpro.co.uk
        notify:
          success: true
          failure: true


  # ═════════════════════════════════════════════════════════════════════════
  # Android is parked until an Android phone is available: Google Play requires
  # device verification from a real handset before an app can be published, and
  # there'd be nothing to install the APK on to test it. The workflow is left
  # here ready — it just isn't run.
  # ═════════════════════════════════════════════════════════════════════════
  android:
    name: Android (parked)
    # Linux is cheaper and faster than mac for Android, and the free tier goes
    # further on it.
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      # Capacitor 8's CLI requires Node >=22.
      node: 22
      java: 17
      groups:
        - firebase
        - supabase
      android_signing:
        # Created in Codemagic: Teams -> Code signing identities -> Android.
        # Keep the keystore safe — losing it means you can never update the
        # listing, only publish a new app.
        - aloto_keystore
      vars:
        PACKAGE_NAME: "com.alotoprediction.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Add the Android platform
        script: npx cap add android || npx cap sync android

      - name: Drop in google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync web build into the native project
        script: npx cap sync android

      - name: Set up signing
        script: |
          cat >> android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Build the release bundle
        # An .aab is what Play Store wants; the .apk is for sideloading onto a
        # phone to test before you upload anything.
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - admin@alotopredictionpro.co.uk
        notify:
          success: true
          failure: true
