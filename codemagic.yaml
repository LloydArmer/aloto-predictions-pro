# codemagic.yaml
#
# Cloud builds for the native apps. Nothing here needs Android Studio or a Mac
# on your machine — Codemagic provides both, which is what makes iOS possible
# from Windows at all.
#
# The native projects are NOT committed to the repo. `npx cap add` regenerates
# them on every build from capacitor.config.ts and dist/, so there's no 200MB of
# generated Gradle and Xcode scaffolding in git, and no chance of it drifting out
# of step with the web build.
#
# The shared steps are written out in full in each workflow rather than shared
# through a YAML anchor. An anchor holding a list, referenced inside another
# list, nests one inside the other — valid YAML, rejected by Codemagic with
# "str type expected".
#
# Before the first run, set these in the Codemagic UI (Environment variables),
# marking each group "secure":
#
#   group: appstore         from App Store Connect -> Users and Access ->
#                           Integrations -> App Store Connect API
#     APP_STORE_CONNECT_ISSUER_ID
#     APP_STORE_CONNECT_KEY_IDENTIFIER
#     APP_STORE_CONNECT_PRIVATE_KEY    the whole .p8 file contents
#
#   group: firebase
#     GOOGLE_SERVICE_INFO_PLIST  contents of GoogleService-Info.plist (iOS)
#     GOOGLE_SERVICES_JSON       contents of google-services.json — Android only,
#                                not needed until you come back to that platform
#
#   group: supabase          the same values as Netlify
#     VITE_SUPABASE_URL
#     VITE_SUPABASE_ANON_KEY
#     VITE_FIREBASE_API_KEY
#     VITE_FIREBASE_AUTH_DOMAIN
#     VITE_FIREBASE_PROJECT_ID
#     VITE_FIREBASE_STORAGE_BUCKET
#     VITE_FIREBASE_SENDER_ID
#     VITE_FIREBASE_APP_ID
#     VITE_FIREBASE_VAPID_KEY

workflows:

  # ═════════════════════════════════════════════════════════════════════════
  # iOS is first. It's the platform being launched on, and it has no
  # device-verification hurdle — Apple lets you build and distribute through
  # TestFlight as soon as the Developer account is approved.
  # ═════════════════════════════════════════════════════════════════════════
  ios:
    name: iOS
    # Apple's toolchain only runs on macOS, so this has to be a mac instance
    # whether you own a Mac or not. That's the point of building in the cloud.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Capacitor 8's CLI requires Node >=22 and exits immediately on anything
      # older. No cocoapods entry either — Capacitor 8 uses Swift Package
      # Manager, so there's no Podfile to install.
      node: 22
      xcode: latest
      groups:
        - firebase
        - supabase
        - appstore
      vars:
        # Read by the signing step below. Kept here rather than in an
        # ios_signing block so nothing needs configuring in the Codemagic UI —
        # that screen moves around and differs by account type, whereas
        # environment variables are the same everywhere.
        BUNDLE_ID: "com.alotoprediction.app"
        # Apple's numeric id for the app, from the App Store Connect URL:
        # appstoreconnect.apple.com/apps/6805768246/... — used to look up the
        # last build number so this one can be higher.
        APP_ID: "6805768246"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Add the iOS platform
        # Regenerated every build rather than committed, so ios/ never drifts
        # out of step with the web build.
        script: npx cap add ios || npx cap sync ios

      - name: Drop in GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist

      - name: Sync web build into the native project
        script: npx cap sync ios

      - name: Prepare the keychain
        # Must run before fetching, or there's nowhere to put the certificate.
        script: keychain initialize

      - name: Fetch signing files from Apple
        # Reads four variables from the environment, so nothing needs setting up
        # in the Codemagic UI:
        #
        #   APP_STORE_CONNECT_ISSUER_ID       who is asking
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY
        #   CERTIFICATE_PRIVATE_KEY           signs the certificate being made
        #
        # That last one is the reason this step failed before. --create has to
        # CREATE a distribution certificate, and a certificate can't exist
        # without a private key behind it.
        #
        # It's supplied as a stored variable rather than generated here on
        # purpose: a new key each build means a new certificate each build, and
        # Apple allows only three distribution certificates per account. Three
        # builds and you'd be locked out.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add the certificate to the keychain
        script: keychain add-certificates

      - name: Apply the profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Set the build number
        # Every upload needs a build number higher than the last, or Apple
        # rejects it as a duplicate.
        #
        # Two sources, in order of preference:
        #
        #   1. The highest build number App Store Connect already has. Apple's
        #      number never goes backwards, so +1 is always safe.
        #   2. Codemagic's own build counter, if the lookup fails.
        #
        # The previous version fell back to `|| echo 0`, which turned a failed
        # lookup into "latest is 0, so build 1" — the same number as last time,
        # and a guaranteed rejection. A fallback that silently produces a wrong
        # answer is worse than no fallback, so this one is loud and refuses to
        # emit a number it knows is stale.
        script: |
          set -e

          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || true)
          echo "App Store Connect reports latest build: '${LATEST:-<lookup failed>}'"

          # Only trust it if it's actually a number.
          if echo "$LATEST" | grep -qE '^[0-9]+$'; then
            NEXT=$((LATEST + 1))
            echo "Using App Store Connect + 1"
          else
            # CM_BUILD_NUMBER / BUILD_NUMBER is Codemagic's own counter, which
            # increments on every build and so can't repeat.
            COUNTER="${CM_BUILD_NUMBER:-${BUILD_NUMBER:-0}}"
            NEXT=$((COUNTER + 1))
            echo "Lookup failed — falling back to Codemagic build counter ($COUNTER) + 1"
          fi

          # 1 has already been used. Anything at or below it is certain to be
          # rejected, so fail here with a clear reason rather than after a
          # fifteen-minute build and an opaque Apple error.
          if [ "$NEXT" -le 1 ]; then
            echo "Refusing to build: computed build number $NEXT has already been uploaded."
            echo "Set APP_ID correctly, or set BUILD_NUMBER_OVERRIDE to something higher."
            exit 1
          fi

          # An explicit override, for getting unstuck by hand.
          if [ -n "$BUILD_NUMBER_OVERRIDE" ]; then
            NEXT="$BUILD_NUMBER_OVERRIDE"
            echo "Overridden to $NEXT"
          fi

          echo "Building version $NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"

          # Confirm it actually took. agvtool can report success while leaving
          # the project untouched if the build settings aren't where it expects.
          APPLIED=$(agvtool what-version -terse)
          echo "Project now reports build number: $APPLIED"
          if [ "$APPLIED" != "$NEXT" ]; then
            echo "agvtool did not apply the version — aborting rather than uploading a duplicate."
            exit 1
          fi

      - name: Build the archive
        # --project, not --workspace. Capacitor 8 uses Swift Package Manager
        # rather than CocoaPods, so there's no Podfile and no .xcworkspace —
        # only App.xcodeproj and a Package.swift. Xcode resolves the packages
        # itself during the build.
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

      - name: Upload to TestFlight
        # Done as a build step rather than through the publishing block.
        # publishing -> app_store_connect -> auth: integration insists on a
        # named integration configured in the Codemagic UI; this CLI reads the
        # same APP_STORE_CONNECT_* environment variables the signing steps
        # already use, so nothing needs setting up there.
        #
        # Uploads only. --testflight is deliberately absent: it submits the
        # build for EXTERNAL beta review, which needs Test Information (feedback
        # email, contact details) filled in first, and fails the build until it
        # is. The upload on its own makes the build available to internal
        # testers immediately, which is all that's needed to install it.
        #
        # Add --testflight later, once Test Information is complete and you want
        # your league testing it.
        script: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - admin@alotopredictionpro.co.uk
        notify:
          success: true
          failure: true


  # ═════════════════════════════════════════════════════════════════════════
  # Android is parked until an Android phone is available: Google Play requires
  # device verification from a real handset before an app can be published, and
  # there'd be nothing to install the APK on to test it. The workflow is left
  # here ready — it just isn't run.
  # ═════════════════════════════════════════════════════════════════════════
  android:
    name: Android (parked)
    # Linux is cheaper and faster than mac for Android, and the free tier goes
    # further on it.
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      # Capacitor 8's CLI requires Node >=22.
      node: 22
      java: 17
      groups:
        - firebase
        - supabase
      android_signing:
        # Created in Codemagic: Teams -> Code signing identities -> Android.
        # Keep the keystore safe — losing it means you can never update the
        # listing, only publish a new app.
        - aloto_keystore
      vars:
        PACKAGE_NAME: "com.alotoprediction.app"

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build the web app
        script: npm run build

      - name: Add the Android platform
        script: npx cap add android || npx cap sync android

      - name: Drop in google-services.json
        script: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync web build into the native project
        script: npx cap sync android

      - name: Set up signing
        script: |
          cat >> android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Build the release bundle
        # An .aab is what Play Store wants; the .apk is for sideloading onto a
        # phone to test before you upload anything.
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - admin@alotopredictionpro.co.uk
        notify:
          success: true
          failure: true
